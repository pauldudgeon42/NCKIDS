# Builds the NC Kids Presenter Mac app.
#  - Every pull request and push to main: run the app's self-check on Linux, then build the Mac installer.
#    The installer (.dmg) is attached to the run as "NC-Kids-Presenter-mac" (Actions tab → the run → Artifacts).
#  - Publishing a Release with a tag like v1.0.0: the installer is also attached to that Release.
name: Mac app

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'Which GitHub Mac machine builds the app (the app works on every Mac either way)'
        type: choice
        options: [macos-15-intel, macos-latest]
        default: macos-15-intel
      backup_build:
        description: 'Also build on Linux (backup for when no Mac machine is free; makes a .zip for Apple Silicon Macs)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Start the app and run its self-check
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox

  build-mac:
    needs: self-check
    # An Intel Mac machine builds the same universal app (Apple Silicon + Intel) as an Apple
    # Silicon one, and GitHub usually has more of them free. To switch, set the repository
    # variable MAC_RUNNER (Settings → Secrets and variables → Actions → Variables) to macos-latest,
    # or pick it when running the workflow by hand.
    runs-on: ${{ inputs.mac_runner || vars.MAC_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the Mac installer
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # The app gets a free "ad-hoc" signature (no Apple account, no secrets involved).
          # Apple Silicon Macs refuse to open apps with no signature at all.
          CSC_FOR_PULL_REQUEST: true
      - name: Check the app's signature
        run: |
          APP="dist/mac-universal/NC Kids Presenter.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format"
          lipo -archs "$APP/Contents/MacOS/NC Kids Presenter"
      - uses: actions/upload-artifact@v4
        with:
          name: NC-Kids-Presenter-mac
          path: dist/*.dmg
          retention-days: 30
      - name: Attach to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg dist/*.zip --clobber

  # Backup: build the Mac app on Linux when GitHub has no Mac machines free.
  # Makes NC-Kids-Presenter-mac-arm64.zip (Apple Silicon Macs). There's no .dmg (that needs a Mac),
  # so unzip it and drag "NC Kids Presenter" into Applications. It gets the same free ad-hoc
  # signature as the normal build, using rcodesign (an open-source signing tool that runs on Linux).
  build-mac-on-linux:
    needs: self-check
    if: github.event_name == 'workflow_dispatch' && inputs.backup_build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the app (Apple Silicon)
        run: npx electron-builder --mac dir --arm64 --publish never -c.mac.identity=null
      - name: Get rcodesign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R indygreg/apple-platform-rs --limit 40 --json tagName --jq '[.[] | select(.tagName | startswith("apple-codesign/"))][0].tagName')
          echo "rcodesign $TAG"
          gh release download "$TAG" -R indygreg/apple-platform-rs --pattern '*x86_64-unknown-linux-musl.tar.gz' -D /tmp/rc
          tar -xzf /tmp/rc/*.tar.gz -C /tmp/rc
          install "$(find /tmp/rc -name rcodesign -type f | head -1)" /usr/local/bin/rcodesign
      - name: Sign (ad-hoc) and check
        run: |
          APP="$(ls -d dist/mac-arm64/*.app)"
          rcodesign sign "$APP"
          rcodesign verify "$APP/Contents/MacOS/NC Kids Presenter"
          rcodesign print-signature-info "$APP/Contents/MacOS/NC Kids Presenter" | grep -iE "identifier|flags|adhoc" | head -5
          file "$APP/Contents/MacOS/NC Kids Presenter"
      - name: Zip it, keeping the Mac file details
        run: |
          cd dist/mac-arm64
          VER=$(node -p "require('../../package.json').version")
          zip -qry --symlinks "../NC-Kids-Presenter-$VER-mac-arm64.zip" "NC Kids Presenter.app"
          ls -la ../*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NC-Kids-Presenter-mac-arm64-backup
          path: dist/*.zip
          retention-days: 30
